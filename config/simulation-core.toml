# INT-01 local Alpha bootstrap. Omitted fields are completed from CoreConfigSchema defaults.
# Alpha 1.1 explicitly runs the simulation at 10 tick/s without changing config schema 1.0 defaults.
# Runtime activation is explicitly gated by MACHIVERSE_ALPHA_LOCAL=1.
[meta]
format = "machiverse-config"
schema_version = "1.0"
component = "simulation-core"

[simulation.step-rate]
numerator = 10
denominator = 1
