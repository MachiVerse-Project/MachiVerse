name: issue-558 runtime validation contract sync

on:
  push:
    branches:
      - fix/issue-558-step4-12h

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-558-step4-12h
          fetch-depth: 0

      - name: Sync runtime validation inputs to 12h QA-04 contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/int03-runtime-target-validation.yml')
          text = path.read_text(encoding='utf-8')
          old_digest = '5de8301439ca57080eefa599da284f9271b29366c791bcb9c2f85ddbfa041423'
          new_digest = '4cdd020abcc8ce37a54944181ce718fb4ae6de8f562bf4f846d669dbdf155a06'
          count = text.count(old_digest)
          if count < 1:
              raise SystemExit('Expected at least one legacy QA-04 manifest digest in runtime validation workflow')
          text = text.replace(old_digest, new_digest)
          text = text.replace('performance.soak.24h', 'performance.soak.12h')
          text = text.replace('86400', '43200')
          if old_digest in text or 'performance.soak.24h' in text or '86400' in text:
              raise SystemExit('Legacy 24h runtime-validation contract value remains')
          path.write_text(text, encoding='utf-8')
          print(f'Updated {count} QA-04 manifest digest occurrence(s).')
          PY
          git diff --check

      - name: Commit sync and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-558-runtime-validation-contract-sync.yml
          git add .github/workflows/int03-runtime-target-validation.yml
          git diff --cached --check
          git commit -m "ci: #558 sync runtime validation with 12h contract"
          git push origin HEAD:fix/issue-558-step4-12h
