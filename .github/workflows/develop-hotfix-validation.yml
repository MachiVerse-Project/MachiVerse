name: Develop hotfix validation

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/MachiVerse.Simulation.Core/**'
      - 'src/MachiVerse.View/**'
      - 'src/MachiVerse.Administration.View/**'
      - '.github/workflows/develop-hotfix-validation.yml'

permissions:
  contents: read

concurrency:
  group: develop-hotfix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  component-builds:
    name: Core and Views build cleanly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build Simulation Core and reject CS8604
        run: dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --warnaserror:CS8604

      - name: Build General View
        run: dotnet build src/MachiVerse.View/MachiVerse.View.csproj --configuration Release

      - name: Build Administration View
        run: dotnet build src/MachiVerse.Administration.View/MachiVerse.Administration.View.csproj --configuration Release
