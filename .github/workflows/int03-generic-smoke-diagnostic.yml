name: INT-03 generic smoke diagnostic

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/MachiVerse.Simulation.Core/**'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/**'
      - '.github/workflows/int03-generic-smoke-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: int03-generic-smoke-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-generic-smoke:
    name: Capture managed stack from generic smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Install managed stack diagnostic tool
        run: dotnet tool install --global dotnet-stack
      - name: Build generic Simulation Core smoke executable
        run: dotnet build tests/MachiVerse.Simulation.Core.SmokeTests/MachiVerse.Simulation.Core.SmokeTests.csproj --configuration Release
      - name: Capture smoke managed stack
        shell: bash
        run: |
          set -euo pipefail
          smoke="$GITHUB_WORKSPACE/tests/MachiVerse.Simulation.Core.SmokeTests/bin/Release/net10.0/MachiVerse.Simulation.Core.SmokeTests"
          "$smoke" > "$RUNNER_TEMP/generic-smoke.stdout" 2> "$RUNNER_TEMP/generic-smoke.stderr" &
          pid=$!
          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              status=$?
              echo "generic smoke exited before diagnostic capture: status=$status"
              cat "$RUNNER_TEMP/generic-smoke.stdout" || true
              cat "$RUNNER_TEMP/generic-smoke.stderr" || true
              exit "$status"
            fi
            sleep 1
          done

          echo '=== generic smoke managed stack after 90s ==='
          dotnet-stack report --process-id "$pid" | tee "$RUNNER_TEMP/generic-smoke.stack"
          echo '=== generic smoke stdout ==='
          cat "$RUNNER_TEMP/generic-smoke.stdout" || true
          echo '=== generic smoke stderr ==='
          cat "$RUNNER_TEMP/generic-smoke.stderr" || true
