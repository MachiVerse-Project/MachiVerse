name: INT-03 Gate4 Step2 CrossDomain turnover validation

on:
  push:
    branches:
      - release/int-03-canonical-snapshot-recovery
    paths:
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04CrossDomainTransactionTurnover.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionCrossDomainTurnoverAuthority.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04CrossDomainStepTransitionDurability.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionReferenceRun.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStep2OperationFlow.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.CrossDomainTransition.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04Step2Transition.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04CrossDomainTransactionTurnoverSmoke.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04CrossDomainTurnoverPersistenceSmoke.cs'
      - '.github/workflows/int03-gate4-step2-cross-domain-turnover-validation.yml'
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04CrossDomainTransactionTurnover.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionCrossDomainTurnoverAuthority.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04CrossDomainStepTransitionDurability.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionReferenceRun.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStep2OperationFlow.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.CrossDomainTransition.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04Step2Transition.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04CrossDomainTransactionTurnoverSmoke.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04CrossDomainTurnoverPersistenceSmoke.cs'
      - '.github/workflows/int03-gate4-step2-cross-domain-turnover-validation.yml'

permissions:
  contents: read

concurrency:
  group: int03-gate4-step2-cross-domain-turnover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-domain-turnover:
    name: CrossDomain 300-Step turnover / SQLite reopen authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Simulation Core smoke tests
        run: dotnet build tests/MachiVerse.Simulation.Core.SmokeTests/MachiVerse.Simulation.Core.SmokeTests.csproj --configuration Release
      - name: Prove turnover, atomic persistence and reopen authority
        run: dotnet run --project tests/MachiVerse.Simulation.Core.SmokeTests/MachiVerse.Simulation.Core.SmokeTests.csproj --configuration Release --no-build
