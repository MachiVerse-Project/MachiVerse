name: Alpha Administration View browser validation

on:
  pull_request:
    branches:
      - integration/1.0-alpha
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: alpha-admin-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  administration-view-browser:
    name: Administration View browser reaches read-only Ready
    if: github.head_ref != 'ci/int-01-admin-browser-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Core Gateway and Administration View
        run: |
          dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
          dotnet build src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release
          dotnet build src/MachiVerse.Administration.View/MachiVerse.Administration.View.csproj --configuration Release
      - name: Launch Alpha stack and verify Admin browser Ready state
        shell: bash
        run: |
          set -euo pipefail
          core_log="$RUNNER_TEMP/alpha-admin-core.log"
          gateway_log="$RUNNER_TEMP/alpha-admin-gateway.log"
          admin_log="$RUNNER_TEMP/alpha-admin-view.log"

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_WORLD_ROOT="$RUNNER_TEMP/machiverse-alpha-admin-world" \
          Kestrel__Endpoints__Grpc__Url=http://127.0.0.1:5511 \
          Kestrel__Endpoints__Grpc__Protocols=Http2 \
          Kestrel__Endpoints__Health__Url=http://127.0.0.1:5510 \
          Kestrel__Endpoints__Health__Protocols=Http1 \
          dotnet run --project src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --no-build >"$core_log" 2>&1 &
          core_pid=$!

          cleanup() {
            kill "${admin_pid:-0}" 2>/dev/null || true
            kill "${gateway_pid:-0}" 2>/dev/null || true
            kill "$core_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          core_ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5510/healthz >/dev/null; then core_ready=1; break; fi
            if ! kill -0 "$core_pid" 2>/dev/null; then cat "$core_log"; exit 1; fi
            sleep 1
          done
          if [ "$core_ready" -ne 1 ]; then cat "$core_log"; exit 1; fi

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_CORE_ENDPOINT=http://127.0.0.1:5511 \
          ASPNETCORE_URLS=http://127.0.0.1:5520 \
          dotnet run --project src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --no-build >"$gateway_log" 2>&1 &
          gateway_pid=$!

          gateway_ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5520/healthz >"$RUNNER_TEMP/admin-gateway-health.json"; then
              if python3 - "$RUNNER_TEMP/admin-gateway-health.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          core = data.get('core') or {}
          assert data.get('status') == 'ready', data
          assert core.get('negotiated') is True, data
          assert core.get('syncState') == 'Synced', data
          assert core.get('localMaster') is True, data
          PY
              then gateway_ready=1; break; fi
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then cat "$gateway_log"; cat "$core_log"; exit 1; fi
            sleep 1
          done
          if [ "$gateway_ready" -ne 1 ]; then cat "$gateway_log"; cat "$core_log"; exit 1; fi

          ASPNETCORE_URLS=http://127.0.0.1:5560 \
          dotnet run --project src/MachiVerse.Administration.View/MachiVerse.Administration.View.csproj --configuration Release --no-build --no-launch-profile >"$admin_log" 2>&1 &
          admin_pid=$!

          admin_ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5560/ >/dev/null; then admin_ready=1; break; fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then cat "$admin_log"; exit 1; fi
            sleep 1
          done
          if [ "$admin_ready" -ne 1 ]; then cat "$admin_log"; exit 1; fi

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=20000 \
            --dump-dom http://127.0.0.1:5560/ >"$RUNNER_TEMP/admin-view-dom.html" 2>"$RUNNER_TEMP/admin-view-browser.log" || {
              cat "$RUNNER_TEMP/admin-view-browser.log"
              cat "$admin_log"
              cat "$gateway_log"
              exit 1
            }

          cat "$RUNNER_TEMP/admin-view-dom.html"
          verify() {
            if ! grep -q "$1" "$RUNNER_TEMP/admin-view-dom.html"; then
              echo "Missing expected Admin DOM marker: $1"
              echo "--- Gateway log ---"
              cat "$gateway_log"
              echo "--- Administration View log ---"
              cat "$admin_log"
              echo "--- Browser log ---"
              cat "$RUNNER_TEMP/admin-view-browser.log"
              exit 1
            fi
          }

          verify '<dd>Ready</dd>'
          verify '<dt>Admin session</dt>'
          verify '<dd>Active</dd>'
          verify '<dt>Health projection</dt>'
          verify '<dd>Loaded</dd>'
          verify '<dt>Config projection</dt>'
          verify '<dt>Config generation</dt>'
          verify '<dd>1</dd>'
          verify '<dt>Health targets</dt>'
          verify '<dt>Config targets</dt>'
          if grep -q '<dt>Gateway error</dt>' "$RUNNER_TEMP/admin-view-dom.html"; then
            echo "Administration View surfaced a Gateway error."
            cat "$RUNNER_TEMP/admin-view-dom.html"
            cat "$gateway_log"
            cat "$admin_log"
            exit 1
          fi
