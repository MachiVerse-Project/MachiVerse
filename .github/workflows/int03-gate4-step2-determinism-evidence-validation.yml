name: INT-03 Gate4 Step2 determinism evidence validation

on:
  push:
    branches:
      - release/int-03-canonical-snapshot-recovery
    paths:
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionDeterminismEvidence.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ClosedPrefixOperationResolver.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04TransitionHistoryTailReplay.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/HistoryIntegrity.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04ClosedPrefixLookup.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04Step2Transition.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04Step2Operations.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStep2OperationFlow.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04Step2DeterminismAuthoritySmoke.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionReferenceRun.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStep2DeterminismRun.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStepCandidateIdentity.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProcessTarget.cs'
      - 'tests/performance-fixtures/v1/gate4-step2-determinism-plan.json'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04Step2DeterminismAuthority.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04TransitionCommittedAuthority.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/Qa04CompactOperationStateSnapshot.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04ProductionDeterminismEvidenceSmoke.cs'
      - 'tools/MachiVerse.Qa04RuntimeTarget/Program.cs'
      - 'tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/Models.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/Program.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunner.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/Qa04DeterminismEvidenceVerifier.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunnerVerification.cs'
      - '.github/workflows/int03-gate4-step2-actual-run-worker.yml'
      - '.github/workflows/int03-gate4-step2-determinism-evidence-validation.yml'
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionDeterminismEvidence.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ClosedPrefixOperationResolver.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04TransitionHistoryTailReplay.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/HistoryIntegrity.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04ClosedPrefixLookup.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04Step2Transition.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/SqlitePersistenceStore.Qa04Step2Operations.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStep2OperationFlow.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04Step2DeterminismAuthoritySmoke.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionReferenceRun.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStep2DeterminismRun.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProductionStepCandidateIdentity.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04ProcessTarget.cs'
      - 'tests/performance-fixtures/v1/gate4-step2-determinism-plan.json'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04Step2DeterminismAuthority.cs'
      - 'src/MachiVerse.Simulation.Core/Performance/Qa04TransitionCommittedAuthority.cs'
      - 'src/MachiVerse.Simulation.Core/Persistence/Qa04CompactOperationStateSnapshot.cs'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/Qa04ProductionDeterminismEvidenceSmoke.cs'
      - 'tools/MachiVerse.Qa04RuntimeTarget/Program.cs'
      - 'tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/Models.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/Program.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunner.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/Qa04DeterminismEvidenceVerifier.cs'
      - 'tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunnerVerification.cs'
      - '.github/workflows/int03-gate4-step2-actual-run-worker.yml'
      - '.github/workflows/int03-gate4-step2-determinism-evidence-validation.yml'

permissions:
  contents: read

concurrency:
  group: int03-gate4-step2-determinism-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  determinism-evidence:
    name: Production determinism producer / verifier contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Simulation Core smoke tests
        run: dotnet build tests/MachiVerse.Simulation.Core.SmokeTests/MachiVerse.Simulation.Core.SmokeTests.csproj --configuration Release
      - name: Verify production determinism evidence fail-closed contract
        run: dotnet run --project tests/MachiVerse.Simulation.Core.SmokeTests/MachiVerse.Simulation.Core.SmokeTests.csproj --configuration Release --no-build
      - name: Build QA-04 runtime target
        run: dotnet build tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj --configuration Release
      - name: Build release evidence verifier
        run: dotnet build tools/MachiVerse.ReleaseEvidenceRunner/MachiVerse.ReleaseEvidenceRunner.csproj --configuration Release
      - name: Verify five-digest and actual Step2 matrix contracts
        run: dotnet run --project tools/MachiVerse.ReleaseEvidenceRunner --configuration Release --no-build -- verify

  # Bounded actual evidence is marker-gated so ordinary Step2 edits run only the lightweight contract.
  # Long-duration stability belongs to Gate4 Step4 24h soak.
  w1r1:
    name: Actual workers=1 / run=1
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 1
      run_ordinal: 1

  w1r2:
    name: Actual workers=1 / run=2
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 1
      run_ordinal: 2

  w1r3:
    name: Actual workers=1 / run=3
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 1
      run_ordinal: 3

  w4r1:
    name: Actual workers=4 / run=1
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 4
      run_ordinal: 1

  w4r2:
    name: Actual workers=4 / run=2
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 4
      run_ordinal: 2

  w4r3:
    name: Actual workers=4 / run=3
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 4
      run_ordinal: 3

  w8r1:
    name: Actual workers=8 / run=1
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 8
      run_ordinal: 1

  w8r2:
    name: Actual workers=8 / run=2
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 8
      run_ordinal: 2

  w8r3:
    name: Actual workers=8 / run=3
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 8
      run_ordinal: 3

  w16r1:
    name: Actual workers=16 / run=1
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 16
      run_ordinal: 1

  w16r2:
    name: Actual workers=16 / run=2
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 16
      run_ordinal: 2

  w16r3:
    name: Actual workers=16 / run=3
    needs: determinism-evidence
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    uses: ./.github/workflows/int03-gate4-step2-actual-run-worker.yml
    with:
      evidence_head: ${{ github.sha }}
      worker_count: 16
      run_ordinal: 3


  aggregate-step2:
    name: Gate4 Step2 12-run equality / completion proof
    needs: [determinism-evidence, w1r1, w1r2, w1r3, w4r1, w4r2, w4r3, w8r1, w8r2, w8r3, w16r1, w16r2, w16r3]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate4-step2-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROW_W1R1: ${{ needs.w1r1.outputs.row_json }}
      ROW_W1R2: ${{ needs.w1r2.outputs.row_json }}
      ROW_W1R3: ${{ needs.w1r3.outputs.row_json }}
      ROW_W4R1: ${{ needs.w4r1.outputs.row_json }}
      ROW_W4R2: ${{ needs.w4r2.outputs.row_json }}
      ROW_W4R3: ${{ needs.w4r3.outputs.row_json }}
      ROW_W8R1: ${{ needs.w8r1.outputs.row_json }}
      ROW_W8R2: ${{ needs.w8r2.outputs.row_json }}
      ROW_W8R3: ${{ needs.w8r3.outputs.row_json }}
      ROW_W16R1: ${{ needs.w16r1.outputs.row_json }}
      ROW_W16R2: ${{ needs.w16r2.outputs.row_json }}
      ROW_W16R3: ${{ needs.w16r3.outputs.row_json }}
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build bounded Step2 verifier
        run: dotnet build tools/MachiVerse.ReleaseEvidenceRunner/MachiVerse.ReleaseEvidenceRunner.csproj --configuration Release

      - name: Assemble 12 actual process-run rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gate4-step2-matrix.json" <<'PY'
          import json, os, sys
          keys = ['ROW_W1R1', 'ROW_W1R2', 'ROW_W1R3', 'ROW_W4R1', 'ROW_W4R2', 'ROW_W4R3', 'ROW_W8R1', 'ROW_W8R2', 'ROW_W8R3', 'ROW_W16R1', 'ROW_W16R2', 'ROW_W16R3']
          rows = [json.loads(os.environ[key]) for key in keys]
          rows.sort(key=lambda row: (row['workerCount'], row['runOrdinal'], row['runId']))
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump(rows, handle, separators=(',', ':'))
              handle.write('\n')
          PY

      - name: Verify exact run contract and five-digest equality
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/MachiVerse.ReleaseEvidenceRunner --configuration Release --no-build -- \
            verify-step2 "$RUNNER_TEMP/gate4-step2-matrix.json" \
            | tee "$RUNNER_TEMP/gate4-step2-verification.log"

      - name: Publish Gate4 Step2 evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gate4-step2-matrix.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              rows = json.load(handle)
          with open(sys.argv[2], 'a', encoding='utf-8') as out:
              out.write("## Gate4 Step2 bounded actual determinism matrix\n\n")
              out.write("| workers | run | transitions | terminal Operations | final state digest |\n")
              out.write("|---:|---:|---:|---:|---|\n")
              for row in rows:
                  out.write(
                      f"| {row['workerCount']} | {row['runOrdinal']} | {row['transitionCount']} | "
                      f"{row['terminalOperationCount']} | `{row['finalStateDigest']}` |\n")
              out.write("\nAll 12 rows use the actual production path. Long-duration stability is owned by Gate4 Step4 24h soak; five-digest equality is enforced by the C# verifier.\n")
          PY
