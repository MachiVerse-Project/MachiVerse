name: issue-558 release acceptance migration

on:
  push:
    branches:
      - fix/issue-558-step4-12h

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-558-step4-12h
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Align ReleaseAcceptance with 12h QA-04 contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/MachiVerse.ReleaseAcceptance/Program.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '5de8301439ca57080eefa599da284f9271b29366c791bcb9c2f85ddbfa041423',
              '4cdd020abcc8ce37a54944181ce718fb4ae6de8f562bf4f846d669dbdf155a06')
          text = text.replace('performance.soak.24h', 'performance.soak.12h')
          text = text.replace('86_400', '43_200')
          text = text.replace('24 wall-clock hours', '12 wall-clock hours')

          required = [
              'private const string CanonicalQa04ManifestSha256 = "4cdd020abcc8ce37a54944181ce718fb4ae6de8f562bf4f846d669dbdf155a06";',
              'RequireEqual(manifest.Soak.TestCaseId, "performance.soak.12h", "soak.testCaseId");',
              'manifest.Soak.MinimumDurationSeconds < 43_200',
              'INT-03 soak minimum cannot be shorter than 12 wall-clock hours.',
          ]
          for value in required:
              if text.count(value) != 1:
                  raise SystemExit(f'ReleaseAcceptance canonical value must occur exactly once: {value}')
          for forbidden in (
              'performance.soak.24h',
              '86_400',
              '24 wall-clock hours',
              '5de8301439ca57080eefa599da284f9271b29366c791bcb9c2f85ddbfa041423',
          ):
              if forbidden in text:
                  raise SystemExit(f'Residual legacy ReleaseAcceptance value remains: {forbidden}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and verify ReleaseAcceptance
        shell: bash
        run: |
          dotnet build tools/MachiVerse.ReleaseAcceptance/MachiVerse.ReleaseAcceptance.csproj --configuration Release
          dotnet run --project tools/MachiVerse.ReleaseAcceptance/MachiVerse.ReleaseAcceptance.csproj --configuration Release --no-build -- verify

      - name: Commit verified migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-558-release-acceptance-migration.yml
          git add tools/MachiVerse.ReleaseAcceptance/Program.cs
          git diff --cached --check
          git commit -m "fix: #558 align release acceptance with 12h soak"
          git push origin HEAD:fix/issue-558-step4-12h
