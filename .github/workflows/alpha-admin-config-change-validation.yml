name: Alpha Administration Config change validation

on:
  pull_request:
    branches:
      - integration/1.0-alpha
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: alpha-admin-config-change-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-config-change:
    name: Administration View applies and rejects stale Config changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Core Gateway and Administration View
        run: |
          dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
          dotnet build src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release
          dotnet build src/MachiVerse.Administration.View/MachiVerse.Administration.View.csproj --configuration Release
      - name: Launch Alpha stack and exercise Config change
        shell: bash
        run: |
          set -euo pipefail
          core_log="$RUNNER_TEMP/alpha-config-core.log"
          gateway_log="$RUNNER_TEMP/alpha-config-gateway.log"
          admin_log="$RUNNER_TEMP/alpha-config-admin.log"
          browser_log="$RUNNER_TEMP/alpha-config-browser.log"
          gateway_data="$RUNNER_TEMP/machiverse-alpha-gateway-data"

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_WORLD_ROOT="$RUNNER_TEMP/machiverse-alpha-config-world" \
          Kestrel__Endpoints__Grpc__Url=http://127.0.0.1:5611 \
          Kestrel__Endpoints__Grpc__Protocols=Http2 \
          Kestrel__Endpoints__Health__Url=http://127.0.0.1:5610 \
          Kestrel__Endpoints__Health__Protocols=Http1 \
          dotnet run --project src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --no-build >"$core_log" 2>&1 &
          core_pid=$!

          cleanup() {
            kill "${browser_pid:-0}" 2>/dev/null || true
            kill "${admin_pid:-0}" 2>/dev/null || true
            kill "${gateway_pid:-0}" 2>/dev/null || true
            kill "$core_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5610/healthz >/dev/null; then break; fi
            if ! kill -0 "$core_pid" 2>/dev/null; then cat "$core_log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5610/healthz >/dev/null

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_CORE_ENDPOINT=http://127.0.0.1:5611 \
          MACHIVERSE_GATEWAY_DATA_ROOT="$gateway_data" \
          ASPNETCORE_URLS=http://127.0.0.1:5620 \
          dotnet run --project src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --no-build >"$gateway_log" 2>&1 &
          gateway_pid=$!

          gateway_ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5620/healthz >"$RUNNER_TEMP/config-gateway-health.json"; then
              if python3 - "$RUNNER_TEMP/config-gateway-health.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          core=data.get('core') or {}
          assert data.get('status') == 'ready', data
          assert core.get('negotiated') is True, data
          assert core.get('syncState') == 'Synced', data
          PY
              then gateway_ready=1; break; fi
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then cat "$gateway_log"; cat "$core_log"; exit 1; fi
            sleep 1
          done
          if [ "$gateway_ready" -ne 1 ]; then cat "$gateway_log"; cat "$core_log"; exit 1; fi

          ASPNETCORE_URLS=http://127.0.0.1:5660 \
          dotnet run --project src/MachiVerse.Administration.View/MachiVerse.Administration.View.csproj --configuration Release --no-build --no-launch-profile >"$admin_log" 2>&1 &
          admin_pid=$!
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5660/ >/dev/null; then break; fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then cat "$admin_log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5660/ >/dev/null

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then echo "No Chromium-compatible browser found."; exit 1; fi
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9322 \
            --user-data-dir="$RUNNER_TEMP/alpha-config-chrome" \
            http://127.0.0.1:5660/ >"$RUNNER_TEMP/alpha-config-browser.stdout" 2>"$browser_log" &
          browser_pid=$!

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9322/json/list >"$RUNNER_TEMP/config-devtools.json"; then break; fi
            sleep 1
          done

          set +e
          node <<'JS'
          const pages = await (await fetch('http://127.0.0.1:9322/json/list')).json();
          const page = pages.find(x => x.type === 'page' && x.url.includes('127.0.0.1:5660')) ?? pages.find(x => x.type === 'page');
          if (!page?.webSocketDebuggerUrl || typeof WebSocket === 'undefined') process.exit(2);
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('CDP open timeout')),5000);ws.onopen=()=>{clearTimeout(t);resolve();};ws.onerror=reject;});
          let id=1; const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;const t=setTimeout(()=>{pending.delete(n);reject(new Error('CDP timeout '+method));},5000);pending.set(n,{resolve:v=>{clearTimeout(t);resolve(v);},reject:e=>{clearTimeout(t);reject(e);}});ws.send(JSON.stringify({id:n,method,params}));});
          const evalJs=async expression => (await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true}))?.result?.value;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const waitText=async (needle, attempts=100)=>{let text='';for(let i=0;i<attempts;i++){text=await evalJs('document.body?.innerText ?? ""');if(text.includes(needle))return text;await sleep(300);}throw new Error('Missing text '+needle+'; last DOM:\n'+text);};
          const clickText=async text=>{const ok=await evalJs(`(()=>{const b=[...document.querySelectorAll('button')].find(x=>x.textContent.includes(${JSON.stringify(text)}));if(!b)return false;b.click();return true;})()`);if(!ok)throw new Error('Button not found: '+text);};

          await send('Runtime.enable');
          await waitText('Lifecycle\nReady');
          await evalJs("location.href='/management'");
          await waitText('Config / Operational Command Management');
          await waitText('ConfigGeneration\n1');
          await clickText('Start local draft');
          await waitText('expected base ConfigGeneration: 1');

          const configured = await evalJs(`(()=>{
            const selects=[...document.querySelectorAll('select')];
            const key=selects[0], kind=selects[1], input=document.querySelector('input');
            if(!key||!kind||!input)return false;
            key.value='peer.heartbeat-interval-ms'; key.dispatchEvent(new Event('change',{bubbles:true}));
            kind.value='Uint'; kind.dispatchEvent(new Event('change',{bubbles:true}));
            input.value='1200'; input.dispatchEvent(new Event('change',{bubbles:true}));
            return true;
          })()`);
          if(!configured) throw new Error('Config draft controls not found');
          await sleep(300);
          await clickText('Add / replace edit');
          await waitText('Local edit prepared for peer.heartbeat-interval-ms.');
          await clickText('Submit Config change');
          let text=await waitText('Config change result: config.change.applied; resulting generation 2.');
          if(!text.includes('ConfigGeneration\n2')) throw new Error('Confirmed Config projection did not advance to generation 2.\n'+text);
          if(!text.includes('config.change.applied')) throw new Error('Applied mutation is not tracked.');

          await clickText('Submit Config change');
          text=await waitText('Config change result: config.generation-stale; resulting generation 2.');
          if(!text.includes('config.generation-stale')) throw new Error('Stale mutation result is not presented.');
          console.log(text);
          ws.close();
          JS
          browser_status=$?
          set -e
          if [ "$browser_status" -ne 0 ]; then
            echo "--- Gateway log ---"; cat "$gateway_log"
            echo "--- Admin log ---"; cat "$admin_log"
            echo "--- Browser log ---"; cat "$browser_log"
            exit "$browser_status"
          fi

          python3 - "$gateway_data/audit/audit.sqlite" <<'PY'
          import sqlite3, sys
          db=sys.argv[1]
          con=sqlite3.connect(db)
          counts=dict(con.execute("select kind,count(*) from audit_record group by kind"))
          assert counts.get('audit.admin.config-change-requested',0) >= 2, counts
          assert counts.get('audit.admin.config-change-applied',0) >= 1, counts
          assert counts.get('audit.admin.config-change-rejected',0) >= 1, counts
          print(counts)
          PY
