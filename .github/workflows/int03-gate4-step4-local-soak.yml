name: INT-03 Gate4 Step4 local 12h soak

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character release-candidate commit SHA used by Step3
        required: true
        type: string
      step3_run_id:
        description: GitHub Actions run ID containing the successful Step3 evidence artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: int03-gate4-local-release-evidence
  cancel-in-progress: false

jobs:
  gate4-step4:
    name: Gate4 Step4 persistence/publication/12h soak
    runs-on: [self-hosted, Windows, X64, machiverse-release-evidence]
    timeout-minutes: 900
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DISPATCH_REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
      STEP3_RUN_ID: ${{ inputs.step3_run_id }}
    steps:
      - name: Require default-branch workflow authority
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:DISPATCH_REF_NAME -ne $env:DEFAULT_BRANCH_NAME) {
            throw "Release-evidence workflow must be dispatched from default branch '$env:DEFAULT_BRANCH_NAME', not '$env:DISPATCH_REF_NAME'."
          }

      - name: Validate dispatch inputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "candidate_sha must be exactly 40 lowercase hexadecimal characters."
          }
          if ($env:STEP3_RUN_ID -notmatch '^[0-9]+$') {
            throw "step3_run_id must contain only decimal digits."
          }

      - name: Ensure dedicated runner is idle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $busy = @(Get-Process | Where-Object { $_.ProcessName -like 'MachiVerse*' })
          if ($busy.Count -ne 0) {
            $busy | Select-Object ProcessName, Id | Format-Table | Out-String | Write-Host
            throw "Another MachiVerse process is already running on the dedicated release-evidence host."
          }

      - name: Materialize exact candidate without Git
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "MachiVerse-Gate4-Release-Evidence"
          }

          $commit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/MachiVerse-Project/MachiVerse/commits/$env:CANDIDATE_SHA"
          if ($commit.sha -ne $env:CANDIDATE_SHA) {
            throw "GitHub resolved candidate '$($commit.sha)' but '$env:CANDIDATE_SHA' was requested."
          }

          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          if ([string]::IsNullOrWhiteSpace($runnerRoot)) {
            throw "Could not resolve runner root from RUNNER_TEMP."
          }

          $archive = Join-Path $env:RUNNER_TEMP ("machiverse-" + $env:CANDIDATE_SHA + ".zip")
          $extract = Join-Path $runnerRoot "_gate4-source"
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/MachiVerse-Project/MachiVerse/zipball/$env:CANDIDATE_SHA" -OutFile $archive

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $extract)

          $roots = @(Get-ChildItem -LiteralPath $extract -Directory -Force)
          if ($roots.Count -ne 1) {
            throw "Expected exactly one source root in candidate archive, found $($roots.Count)."
          }

          $sourceRoot = $roots[0].FullName
          Set-Content -LiteralPath (Join-Path $sourceRoot ".machiverse-source-commit") -Value $env:CANDIDATE_SHA -Encoding ascii

          $requiredRootPaths = @("AGENTS.md", "global.json", "src", "tools")
          foreach ($required in $requiredRootPaths) {
            if (-not (Test-Path (Join-Path $sourceRoot $required))) {
              throw "Candidate source materialization is missing required root path: $required"
            }
          }

          "QA04_SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify materialized candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:QA04_SOURCE_ROOT)) {
            throw "QA04_SOURCE_ROOT is not available."
          }
          $marker = Join-Path $env:QA04_SOURCE_ROOT ".machiverse-source-commit"
          if (-not (Test-Path $marker)) {
            throw "Candidate source marker is missing."
          }
          $actual = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Materialized candidate $actual does not match requested candidate $env:CANDIDATE_SHA."
          }

      - name: Require applied Alpha 1.1 candidate contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:QA04_SOURCE_ROOT
          $manifestPath = Join-Path $root 'tests/performance-fixtures/v1/harness-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $acceptance = Get-Content -LiteralPath (Join-Path $root 'tests/release-acceptance-fixtures/v1/acceptance-manifest.json') -Raw | ConvertFrom-Json
          $policy = Get-Content -LiteralPath (Join-Path $root 'config/qa04-alpha11.json') -Raw | ConvertFrom-Json
          $plan = Get-Content -LiteralPath (Join-Path $root 'tests/performance-fixtures/v1/gate4-step2-determinism-plan.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.soakProfile.testCaseId -ne 'performance.soak.12h' -or $manifest.soakProfile.durationHours -ne 12 -or $manifest.soakProfile.gatewayReconnectFailoverIntervalMinutes -le 0) {
            throw 'Candidate must implement the canonical 12h soak contract before using this workflow timeout.'
          }
          if ($acceptance.qa04ManifestSha256 -ne $digest -or $plan.longDurationEvidence -ne 'gate4-step4-12h-soak') {
            throw 'Candidate manifest/acceptance/Step2 ownership bindings do not match.'
          }
          if ($policy.stepRateNumerator -ne 10 -or $policy.stepRateDenominator -ne 1 -or $policy.acceptanceProfile -ne 'qa04.alpha11.10hz.v1') {
            throw 'Candidate does not implement the standard Alpha 1.1 10Hz acceptance profile.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'docs/design/phase4-alpha11-runtime-release-profile.md'))) {
            throw 'Candidate is missing the integrated normative Alpha 1.1 profile.'
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 10.0.400

      - name: Download Step3 evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: gate4-step3-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/gate4-step3-input
          run-id: ${{ inputs.step3_run_id }}
          github-token: ${{ github.token }}

      - name: Build exact candidate and materialize plan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -LiteralPath $env:QA04_SOURCE_ROOT
          $coreOut = Join-Path $env:RUNNER_TEMP "qa04-core"
          $adapterOut = Join-Path $env:RUNNER_TEMP "qa04-adapter"
          $gatewayOut = Join-Path $env:RUNNER_TEMP "qa04-gateway"
          $plan = Join-Path $env:RUNNER_TEMP "qa04-plan"
          $output = Join-Path $env:RUNNER_TEMP "gate4-step4"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          dotnet publish src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --output $coreOut
          dotnet publish tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj --configuration Release --output $adapterOut
          dotnet publish src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --output $gatewayOut
          dotnet build tools/MachiVerse.ReleaseEvidenceRunner/MachiVerse.ReleaseEvidenceRunner.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Runner build failed.' }
          dotnet run --project tools/MachiVerse.ReleaseEvidenceRunner --configuration Release --no-build -- verify
          if ($LASTEXITCODE -ne 0) { throw 'Candidate release contract verification failed.' }
          dotnet run --project tests/MachiVerse.Qa04RuntimeTarget.ScheduleTests --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Candidate soak schedule boundary verification failed.' }
          dotnet run --project tools/MachiVerse.PerformanceHarness --configuration Release -- materialize $plan

          $suffix = ".exe"
          $core = Join-Path $coreOut ("MachiVerse.Simulation.Core" + $suffix)
          $adapter = Join-Path $adapterOut ("MachiVerse.Qa04RuntimeTarget" + $suffix)
          $gateway = Join-Path $gatewayOut ("MachiVerse.Gateway" + $suffix)
          if (-not (Test-Path $core)) { throw "Simulation Core executable not found: $core" }
          if (-not (Test-Path $adapter)) { throw "QA-04 runtime adapter not found: $adapter" }
          if (-not (Test-Path $gateway)) { throw "Gateway executable not found: $gateway" }

          "MACHIVERSE_QA04_CORE_EXECUTABLE=$core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MACHIVERSE_QA04_GATEWAY_EXECUTABLE=$gateway" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA04_RUNTIME_ADAPTER=$adapter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA04_PLAN=$plan" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA04_STEP4_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA04_STEP3_EVIDENCE=$(Join-Path $env:RUNNER_TEMP 'gate4-step3-input/gate4-step3-benchmark-evidence.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Step4 fail-closed preflight then 12h soak
        shell: powershell
        run: |
          Set-Location -LiteralPath $env:QA04_SOURCE_ROOT
          dotnet run --project tools/MachiVerse.ReleaseEvidenceRunner --configuration Release --no-build -- run-step4 release $env:CANDIDATE_SHA $env:QA04_RUNTIME_ADAPTER $env:QA04_PLAN $env:QA04_STEP3_EVIDENCE $env:QA04_STEP4_OUTPUT

      - name: Upload Step4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate4-step4-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/gate4-step4
          if-no-files-found: warn
