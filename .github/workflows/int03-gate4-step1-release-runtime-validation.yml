name: INT-03 Gate4 Step1 release runtime evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
    paths:
      - 'src/MachiVerse.Simulation.Core/**'
      - 'tools/MachiVerse.Qa04RuntimeTarget/**'
      - '.github/workflows/int03-gate4-step1-release-runtime-validation.yml'

permissions:
  contents: read

concurrency:
  group: int03-gate4-step1-release-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  actual-release-runtime:
    name: Actual external adapter -> production reference run
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Determine whether actual evidence execution was explicitly requested
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="$(git log -1 --format=%s)"
          echo "Evidence head subject: $subject"
          if [[ "$subject" == *"[gate4-step1-evidence]"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Actual Gate4 Step1 release evidence is marker-gated; ordinary PR CI remains bounded."
          fi

      - name: Setup .NET SDK
        if: steps.evidence.outputs.run == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build Simulation Core and external runtime adapter
        if: steps.evidence.outputs.run == 'true'
        run: |
          dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
          dotnet build tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj --configuration Release

      - name: Execute one actual canonical release benchmark run
        if: steps.evidence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/src/MachiVerse.Simulation.Core/bin/Release/net10.0/MachiVerse.Simulation.Core"
          adapter="$GITHUB_WORKSPACE/tools/MachiVerse.Qa04RuntimeTarget/bin/Release/net10.0/MachiVerse.Qa04RuntimeTarget"
          export MACHIVERSE_QA04_CORE_EXECUTABLE="$core"
          request=$(python3 - <<'PY'
          import json
          print(json.dumps({
              'schemaVersion':'1.0',
              'requestKind':'benchmark-run',
              'executionClass':'release',
              'requestId':'gate4.step1.worker1.run1',
              'sourceCommit':'${{ github.event.pull_request.head.sha || github.sha }}',
              'qa04ManifestSha256':'5de8301439ca57080eefa599da284f9271b29366c791bcb9c2f85ddbfa041423',
              'profileId':'perf.reference.v1',
              'run':{
                  'runId':'gate4.step1.worker1.run1',
                  'benchmarkProfileId':'perf.reference.v1',
                  'workerCount':1,
                  'runOrdinal':1,
                  'warmupSteps':9000,
                  'measurementSteps':18000,
                  'worldSeed':'000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f'
              },
              'profile':{}
          }, separators=(',', ':')))
          PY
          )
          printf '%s\n' "$request" | "$adapter" | tee "$RUNNER_TEMP/gate4-step1-release-response.json"

      - name: Validate actual release runtime evidence
        if: steps.evidence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gate4-step1-release-response.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              response = json.load(f)
          report = response['report']
          assert response['executionClass'] == 'release', response
          assert response['responseKind'] == 'performance-benchmark-report-v1', response
          assert response['referenceWorldMaterialized'] is True, response
          assert response['releaseEvidenceCapable'] is False, response
          assert response['blockingFailureCodes'] == [], response
          assert report['worker_count'] == 1, report
          assert report['run_ordinal'] == 1, report
          assert report['step_count'] == 18000, report
          assert report['snapshot_summary']['measured'] is True, report
          assert report['snapshot_summary']['snapshot_step'] == 18000, report
          assert report['snapshot_summary']['drain_completed'] is True, report
          assert report['snapshot_summary']['section_count'] == 103, report
          assert report['snapshot_summary']['chunk_count'] > 0, report
          for key in (
              'final_state_digest',
              'final_history_digest',
              'final_continuity_token',
              'candidate_id_sequence_digest',
          ):
              value = report[key]
              assert len(value) == 64 and value == value.lower() and set(value) != {'0'}, (key, value)
          for key in ('snapshot_digest','physical_manifest_digest','recovered_state_digest'):
              value = report['snapshot_summary'][key]
              assert len(value) == 64 and value == value.lower() and set(value) != {'0'}, (key, value)
          assert report['accepted_operation_loss'] == 0, report
          assert report['hidden_solver_iteration_reduction'] is False, report
          print('Gate4 Step1 actual release runtime connection PASS')
          print('final_state_digest=' + report['final_state_digest'])
          print('final_history_digest=' + report['final_history_digest'])
          print('final_continuity_token=' + report['final_continuity_token'])
          print('candidate_id_sequence_digest=' + report['candidate_id_sequence_digest'])
          print('snapshot_digest=' + report['snapshot_summary']['snapshot_digest'])
          PY