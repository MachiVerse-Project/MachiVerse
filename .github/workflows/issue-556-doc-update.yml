name: issue-556 Alpha 1.1 documentation alignment

on:
  push:
    branches:
      - docs/alpha11-10hz-step-rate

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/alpha11-10hz-step-rate
          fetch-depth: 0
      - name: Align current Alpha 1.1 canonical documentation
        run: python3 scripts/issue-556-doc-update.py
      - name: Verify Alpha 1.1 canonical contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'simulation.step-rate.numerator = 10' docs/design/phase4-alpha11-runtime-release-profile.md
          grep -q 'performance.soak.12h' docs/design/phase4-alpha11-runtime-release-profile.md
          grep -q '43200' docs/release-evidence-runner.md
          grep -q '4cdd020abcc8ce37a54944181ce718fb4ae6de8f562bf4f846d669dbdf155a06' docs/release-evidence-runner.md
          grep -q 'p99 authoritative Step processing time <=100ms' docs/design/phase4-test-acceptance.md
          grep -q 'deadline miss ratio <=1%' docs/design/phase4-test-acceptance.md
          grep -q 'numerator = 30' docs/design/phase4-config-standard-examples.md
          grep -q 'numerator = 10' docs/design/phase4-config-standard-examples.md
          if grep -n 'performance.soak.24h' docs/release-acceptance.md docs/release-evidence-runner.md docs/design/phase4-test-acceptance.md; then
            echo 'Legacy 24h hard-gate ID remains in current release canonical docs.' >&2
            exit 1
          fi
      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --check
          git commit -m "docs: #556 align Alpha 1.1 10Hz runtime and 12h release contract"
          git push origin HEAD:docs/alpha11-10hz-step-rate
