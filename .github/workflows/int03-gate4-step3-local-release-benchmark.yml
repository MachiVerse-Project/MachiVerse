name: INT-03 Gate4 Step3 local release benchmark

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character release-candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: int03-gate4-local-release-evidence
  cancel-in-progress: false

jobs:
  gate4-step3:
    name: Gate4 Step3 canonical benchmark
    runs-on: [self-hosted, Windows, X64, machiverse-release-evidence]
    timeout-minutes: 420
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DISPATCH_REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
      MACHIVERSE_GATE4_STEP3_PERSISTENCE_INSERT_BATCH_SIZE: "400"
      MACHIVERSE_GATE4_STEP3_PHASE_LOG_INTERVAL_TRANSITIONS: "50"
      QA04_STEP3_TARGET_SECONDS: "21600"
      QA04_STEP3_MAX_SECONDS: "25200"
      QA04_STEP3_PRECHECK_TRANSITIONS: "30"
      QA04_STEP3_PRECHECK_INTERVAL_TRANSITIONS: "10"
      QA04_STEP3_PRECHECK_TIMEOUT_SECONDS: "900"
    steps:
      - name: Require default-branch workflow authority
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:DISPATCH_REF_NAME -ne $env:DEFAULT_BRANCH_NAME) {
            throw "Release-evidence workflow must be dispatched from default branch '$env:DEFAULT_BRANCH_NAME', not '$env:DISPATCH_REF_NAME'."
          }

      - name: Validate candidate input
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "candidate_sha must be exactly 40 lowercase hexadecimal characters."
          }

      - name: Ensure dedicated runner is idle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $busy = @(Get-Process | Where-Object { $_.ProcessName -like 'MachiVerse*' })
          if ($busy.Count -ne 0) {
            $busy | Select-Object ProcessName, Id | Format-Table | Out-String | Write-Host
            throw "Another MachiVerse process is already running on the dedicated release-evidence host."
          }

      - name: Materialize exact candidate without Git
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "MachiVerse-Gate4-Release-Evidence"
          }

          $commit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/MachiVerse-Project/MachiVerse/commits/$env:CANDIDATE_SHA"
          if ($commit.sha -ne $env:CANDIDATE_SHA) {
            throw "GitHub resolved candidate '$($commit.sha)' but '$env:CANDIDATE_SHA' was requested."
          }

          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          if ([string]::IsNullOrWhiteSpace($runnerRoot)) {
            throw "Could not resolve runner root from RUNNER_TEMP."
          }

          $archive = Join-Path $env:RUNNER_TEMP ("machiverse-" + $env:CANDIDATE_SHA + ".zip")
          $extract = Join-Path $runnerRoot "_gate4-source"
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/MachiVerse-Project/MachiVerse/zipball/$env:CANDIDATE_SHA" -OutFile $archive

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $extract)

          $roots = @(Get-ChildItem -LiteralPath $extract -Directory -Force)
          if ($roots.Count -ne 1) {
            throw "Expected exactly one source root in candidate archive, found $($roots.Count)."
          }

          $sourceRoot = $roots[0].FullName
          Set-Content -LiteralPath (Join-Path $sourceRoot ".machiverse-source-commit") -Value $env:CANDIDATE_SHA -Encoding ascii

          $requiredRootPaths = @("AGENTS.md", "global.json", "src", "tools")
          foreach ($required in $requiredRootPaths) {
            if (-not (Test-Path (Join-Path $sourceRoot $required))) {
              throw "Candidate source materialization is missing required root path: $required"
            }
          }

          "QA04_SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify materialized candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:QA04_SOURCE_ROOT)) {
            throw "QA04_SOURCE_ROOT is not available."
          }
          $marker = Join-Path $env:QA04_SOURCE_ROOT ".machiverse-source-commit"
          if (-not (Test-Path $marker)) {
            throw "Candidate source marker is missing."
          }
          $actual = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Materialized candidate $actual does not match requested candidate $env:CANDIDATE_SHA."
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 10.0.400

      - name: Record runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "gate4-step3"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $record = [ordered]@{
            schemaVersion = "1.0"
            sourceCommit = $env:CANDIDATE_SHA
            runnerName = $env:RUNNER_NAME
            osDescription = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            processorCount = [Environment]::ProcessorCount
            dotnetSdk = (dotnet --version).Trim()
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $output "runner-environment.json")
          "QA04_STEP3_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -LiteralPath $env:QA04_SOURCE_ROOT
          $coreOut = Join-Path $env:RUNNER_TEMP "qa04-core"
          $adapterOut = Join-Path $env:RUNNER_TEMP "qa04-adapter"
          $plan = Join-Path $env:RUNNER_TEMP "qa04-plan"
          dotnet publish src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --output $coreOut
          dotnet publish tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj --configuration Release --output $adapterOut
          dotnet build tools/MachiVerse.ReleaseEvidenceRunner/MachiVerse.ReleaseEvidenceRunner.csproj --configuration Release
          dotnet run --project tools/MachiVerse.PerformanceHarness --configuration Release -- materialize $plan

          $suffix = ".exe"
          $core = Join-Path $coreOut ("MachiVerse.Simulation.Core" + $suffix)
          $adapter = Join-Path $adapterOut ("MachiVerse.Qa04RuntimeTarget" + $suffix)
          if (-not (Test-Path $core)) { throw "Simulation Core executable not found: $core" }
          if (-not (Test-Path $adapter)) { throw "QA-04 runtime adapter not found: $adapter" }

          "MACHIVERSE_QA04_CORE_EXECUTABLE=$core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA04_RUNTIME_ADAPTER=$adapter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA04_PLAN=$plan" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Step3 performance precheck
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -LiteralPath $env:QA04_SOURCE_ROOT

          $manifestPath = Join-Path $env:QA04_SOURCE_ROOT "tests/performance-fixtures/v1/harness-manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $workerCounts = @($manifest.workerCounts)
          $runsPerWorker = [int]$manifest.processRunsPerWorker
          $canonicalTransitions = [int]$manifest.warmupSteps + [int]$manifest.measurementSteps
          $steadyOperations = [double]$manifest.referenceLoad.operationLoad.steadyPerStep

          $precheckTransitions = [int]$env:QA04_STEP3_PRECHECK_TRANSITIONS
          $progressInterval = [int]$env:QA04_STEP3_PRECHECK_INTERVAL_TRANSITIONS
          $precheckTimeoutSeconds = [int]$env:QA04_STEP3_PRECHECK_TIMEOUT_SECONDS
          $targetSeconds = [double]$env:QA04_STEP3_TARGET_SECONDS
          $maxSeconds = [double]$env:QA04_STEP3_MAX_SECONDS
          $batchSize = [int]$env:MACHIVERSE_GATE4_STEP3_PERSISTENCE_INSERT_BATCH_SIZE

          if ($workerCounts.Count -eq 0 -or $runsPerWorker -le 0 -or $canonicalTransitions -le 0 -or $steadyOperations -le 0) {
            throw "Canonical Step3 manifest shape is invalid for performance precheck."
          }
          if ($precheckTransitions -le 0 -or $progressInterval -le 0 -or $precheckTransitions -lt $progressInterval -or
              $precheckTransitions % $progressInterval -ne 0 -or $precheckTimeoutSeconds -le 0 -or
              $targetSeconds -le 0 -or $maxSeconds -lt $targetSeconds -or $batchSize -le 0) {
            throw "Step3 performance precheck configuration is invalid."
          }

          $precheckOutput = Join-Path $env:QA04_STEP3_OUTPUT "precheck"
          New-Item -ItemType Directory -Force -Path $precheckOutput | Out-Null
          $rows = @()
          $estimatedMatrixSeconds = 0.0
          foreach ($workersRaw in $workerCounts) {
            $workers = [int]$workersRaw
            $root = Join-Path $env:RUNNER_TEMP ("qa04-step3-precheck-w" + $workers)
            $requestPath = Join-Path $precheckOutput ("workers-" + $workers + ".request.jsonl")
            $stdoutPath = Join-Path $precheckOutput ("workers-" + $workers + ".stdout.log")
            $stderrPath = Join-Path $precheckOutput ("workers-" + $workers + ".stderr.log")
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $requestPath,$stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue

            $request = [ordered]@{
              schemaVersion = "1.0"
              command = "production-step2-determinism-run"
              workerCount = $workers
              transitionCount = $precheckTransitions
              persistenceInsertBatchSize = $batchSize
              progressIntervalTransitions = $progressInterval
              persistenceRoot = $root
            } | ConvertTo-Json -Compress
            $utf8NoBom = New-Object System.Text.UTF8Encoding -ArgumentList $false
            $requestBytes = $utf8NoBom.GetBytes($request + "`n")
            if ($requestBytes.Length -eq 0 -or $requestBytes[0] -ne 0x7B) {
              throw "Step3 performance precheck request must start with JSON object byte 0x7B for workers=$workers."
            }
            [System.IO.File]::WriteAllBytes($requestPath, $requestBytes)

            Write-Host "GATE4_STEP3_PRECHECK_START workers=$workers transitions=$precheckTransitions interval=$progressInterval request_bytes=$($requestBytes.Length)"
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = $env:ComSpec
            $startInfo.Arguments = '/d /s /c ""{0}" qa04-target < "{1}""' -f $env:MACHIVERSE_QA04_CORE_EXECUTABLE, $requestPath
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardInput = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true

            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "Step3 performance precheck process failed to start for workers=$workers."
            }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()

            if (-not $process.WaitForExit($precheckTimeoutSeconds * 1000)) {
              try { $process.Kill() } catch {}
              $process.WaitForExit()
              $stdout = $stdoutTask.GetAwaiter().GetResult()
              $stderr = $stderrTask.GetAwaiter().GetResult()
              Set-Content -LiteralPath $stdoutPath -Value $stdout -Encoding utf8
              Set-Content -LiteralPath $stderrPath -Value $stderr -Encoding utf8
              throw "Step3 performance precheck timed out for workers=$workers after $precheckTimeoutSeconds seconds."
            }

            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            Set-Content -LiteralPath $stdoutPath -Value $stdout -Encoding utf8
            Set-Content -LiteralPath $stderrPath -Value $stderr -Encoding utf8
            $exitCode = $process.ExitCode
            $process.Dispose()

            if ($exitCode -ne 0) {
              $tail = @($stderr -split [Environment]::NewLine | Select-Object -Last 40) -join [Environment]::NewLine
              throw "Step3 performance precheck failed for workers=$workers exit=${exitCode}: $tail"
            }

            $progressLine = Get-Content -LiteralPath $stderrPath | Where-Object { $_ -match '^QA04_PROGRESS phase=actual-run ' } | Select-Object -Last 1
            if ([string]::IsNullOrWhiteSpace($progressLine) -or $progressLine -notmatch 'interval_ops_per_second=([0-9]+(?:\.[0-9]+)?)') {
              throw "Step3 performance precheck did not emit interval throughput for workers=$workers."
            }

            $rate = [double]::Parse($Matches[1], [System.Globalization.CultureInfo]::InvariantCulture)
            if ($rate -le 0) { throw "Step3 performance precheck throughput must be positive for workers=$workers." }

            if ($progressLine -notmatch 'total_elapsed_seconds=([0-9]+(?:\.[0-9]+)?)') {
              throw "Step3 performance precheck did not emit total elapsed time for workers=$workers."
            }
            $totalElapsedSeconds = [double]::Parse($Matches[1], [System.Globalization.CultureInfo]::InvariantCulture)
            if ($progressLine -notmatch 'actual_elapsed_seconds=([0-9]+(?:\.[0-9]+)?)') {
              throw "Step3 performance precheck did not emit actual elapsed time for workers=$workers."
            }
            $actualElapsedSeconds = [double]::Parse($Matches[1], [System.Globalization.CultureInfo]::InvariantCulture)
            if ($totalElapsedSeconds -lt $actualElapsedSeconds -or $actualElapsedSeconds -le 0) {
              throw "Step3 performance precheck elapsed-time relationship is invalid for workers=$workers."
            }

            $startupSecondsPerRun = $totalElapsedSeconds - $actualElapsedSeconds
            $steadyStepSeconds = $steadyOperations / $rate
            $transitionSecondsPerRun = $steadyStepSeconds * $canonicalTransitions
            $workerEstimateSeconds = ($startupSecondsPerRun + $transitionSecondsPerRun) * $runsPerWorker
            $estimatedMatrixSeconds += $workerEstimateSeconds
            $rows += [pscustomobject]@{
              workers = $workers
              intervalOpsPerSecond = [math]::Round($rate, 3)
              estimatedSteadyStepMs = [math]::Round($steadyStepSeconds * 1000.0, 3)
              startupSecondsPerRun = [math]::Round($startupSecondsPerRun, 1)
              estimatedTransitionSecondsPerRun = [math]::Round($transitionSecondsPerRun, 1)
              estimatedWorkerGroupSeconds = [math]::Round($workerEstimateSeconds, 1)
            }
            Write-Host ("GATE4_STEP3_PRECHECK workers={0} interval_ops_per_second={1:F1} estimated_step_ms={2:F1} startup_seconds_per_run={3:F1} estimated_worker_group_seconds={4:F1}" -f $workers, $rate, ($steadyStepSeconds * 1000.0), $startupSecondsPerRun, $workerEstimateSeconds)

            $partialReport = [ordered]@{
              schemaVersion = "1.0"
              sourceCommit = $env:CANDIDATE_SHA
              precheckTransitions = $precheckTransitions
              progressIntervalTransitions = $progressInterval
              canonicalTransitionsPerRun = $canonicalTransitions
              runsPerWorker = $runsPerWorker
              targetSeconds = $targetSeconds
              maxSeconds = $maxSeconds
              estimatedMatrixSecondsLowerBound = [math]::Round($estimatedMatrixSeconds, 1)
              estimatedMatrixHoursLowerBound = [math]::Round($estimatedMatrixSeconds / 3600.0, 3)
              rows = $rows
            }
            $reportPath = Join-Path $env:QA04_STEP3_OUTPUT "step3-performance-precheck.json"
            $partialReport | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8

            if ($estimatedMatrixSeconds -gt $maxSeconds) {
              throw "Estimated Step3 matrix runtime lower bound already exceeds the configured hard upper bound after workers=$workers; remaining precheck rows and canonical benchmark will not start."
            }
          }

          $report = [ordered]@{
            schemaVersion = "1.0"
            sourceCommit = $env:CANDIDATE_SHA
            precheckTransitions = $precheckTransitions
            progressIntervalTransitions = $progressInterval
            canonicalTransitionsPerRun = $canonicalTransitions
            runsPerWorker = $runsPerWorker
            targetSeconds = $targetSeconds
            maxSeconds = $maxSeconds
            estimatedMatrixSeconds = [math]::Round($estimatedMatrixSeconds, 1)
            estimatedMatrixHours = [math]::Round($estimatedMatrixSeconds / 3600.0, 3)
            rows = $rows
          }
          $reportPath = Join-Path $env:QA04_STEP3_OUTPUT "step3-performance-precheck.json"
          $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8

          Write-Host ("GATE4_STEP3_PRECHECK_SUMMARY estimated_matrix_hours={0:F2} target_hours={1:F2} max_hours={2:F2}" -f ($estimatedMatrixSeconds / 3600.0), ($targetSeconds / 3600.0), ($maxSeconds / 3600.0))
          if ($estimatedMatrixSeconds -gt $maxSeconds) {
            throw "Estimated Step3 matrix runtime exceeds the configured hard upper bound; canonical benchmark will not start."
          }
          if ($estimatedMatrixSeconds -gt $targetSeconds) {
            Write-Warning "Estimated Step3 matrix runtime exceeds the 6-hour target but remains within the configured hard upper bound."
          }

      - name: Run canonical Step3 release benchmark
        shell: powershell
        run: |
          Set-Location -LiteralPath $env:QA04_SOURCE_ROOT
          dotnet run --project tools/MachiVerse.ReleaseEvidenceRunner --configuration Release --no-build -- run-step3 release $env:CANDIDATE_SHA $env:QA04_RUNTIME_ADAPTER $env:QA04_PLAN $env:QA04_STEP3_OUTPUT

      - name: Upload Step3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate4-step3-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/gate4-step3
          if-no-files-found: warn
