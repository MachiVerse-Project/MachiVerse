name: issue-556 Alpha 1.1 docs contract audit

on:
  push:
    branches:
      - docs/alpha11-10hz-step-rate

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/alpha11-10hz-step-rate
      - name: Audit current and historical runtime/performance references
        shell: bash
        run: |
          set -u
          echo '=== SOAK_24H ==='
          git grep -n -E 'performance\.soak\.24h|24h soak|24-hour soak|24 wall-clock|24 hours continuous|24時間' -- docs || true
          echo '=== RATE_30HZ ==='
          git grep -n -E '30Hz|30 Hz|30 tick|33\.333 ms|p99[^0-9]*50 ms|60-second mean[^0-9]*30 ms' -- docs || true
          echo '=== CURRENT_ALPHA11 ==='
          git grep -n -E 'Alpha 1\.1|10 tick/s|10Hz|12h soak|12 wall-clock' -- docs || true
