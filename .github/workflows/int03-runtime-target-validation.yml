name: INT-03 runtime target validation

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/MachiVerse.Simulation.Core/**'
      - 'tests/MachiVerse.Simulation.Core.SmokeTests/**'
      - 'tools/MachiVerse.Qa04RuntimeTarget/**'
      - '.github/workflows/int03-runtime-target-validation.yml'

permissions:
  contents: read

concurrency:
  group: int03-runtime-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core-reference-load:
    name: Core QA-04 reference-load contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Simulation Core
        run: dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
      - name: Run Simulation Core smoke tests
        run: dotnet run --project tests/MachiVerse.Simulation.Core.SmokeTests --configuration Release
