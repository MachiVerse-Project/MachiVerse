name: Alpha View continuity fault validation

on:
  pull_request:
    branches:
      - integration/1.0-alpha
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: alpha-view-continuity-fault-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bad-base-recovery:
    name: View rejects bad DELTA base and recovers with real FULL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Core Gateway General View and test-owned fault proxy
        run: |
          dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
          dotnet build src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release
          dotnet build src/MachiVerse.View/MachiVerse.View.csproj --configuration Release
          dotnet build tests/MachiVerse.Alpha.ViewFaultProxy/MachiVerse.Alpha.ViewFaultProxy.csproj --configuration Release
      - name: Exercise bad-base fail-closed and FULL recovery
        shell: bash
        run: |
          set -euo pipefail
          world_root="$RUNNER_TEMP/machiverse-alpha-fault-world"
          core_log="$RUNNER_TEMP/alpha-fault-core.log"
          gateway_log="$RUNNER_TEMP/alpha-fault-gateway.log"
          proxy_log="$RUNNER_TEMP/alpha-fault-proxy.log"
          view_log="$RUNNER_TEMP/alpha-fault-view.log"
          browser_log="$RUNNER_TEMP/alpha-fault-browser.log"

          stop_process() {
            pid="${1:-0}"
            if [ "$pid" -le 1 ] || ! kill -0 "$pid" 2>/dev/null; then return 0; fi
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then return 0; fi
              sleep 0.25
            done
            kill -9 "$pid" 2>/dev/null || true
          }
          cleanup() {
            stop_process "${browser_pid:-0}"
            stop_process "${view_pid:-0}"
            stop_process "${proxy_pid:-0}"
            stop_process "${gateway_pid:-0}"
            stop_process "${core_pid:-0}"
          }
          trap cleanup EXIT

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_WORLD_ROOT="$world_root" \
          Kestrel__Endpoints__Grpc__Url=http://127.0.0.1:5811 \
          Kestrel__Endpoints__Grpc__Protocols=Http2 \
          Kestrel__Endpoints__Health__Url=http://127.0.0.1:5810 \
          Kestrel__Endpoints__Health__Protocols=Http1 \
          dotnet run --project src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --no-build >"$core_log" 2>&1 &
          core_pid=$!
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5810/healthz >/dev/null; then break; fi
            if ! kill -0 "$core_pid" 2>/dev/null; then cat "$core_log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5810/healthz >/dev/null

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_CORE_ENDPOINT=http://127.0.0.1:5811 \
          ASPNETCORE_URLS=http://127.0.0.1:5720 \
          dotnet run --project src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --no-build >"$gateway_log" 2>&1 &
          gateway_pid=$!
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5720/healthz >"$RUNNER_TEMP/fault-gateway-health.json"; then
              if python3 - "$RUNNER_TEMP/fault-gateway-health.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('status') == 'ready', data
          assert (data.get('core') or {}).get('basisStep') == 0, data
          PY
              then break; fi
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then cat "$gateway_log"; cat "$core_log"; exit 1; fi
            sleep 1
          done

          MACHIVERSE_FAULT_PROXY_UPSTREAM=ws://127.0.0.1:5720/ws/v1/view \
          ASPNETCORE_URLS=http://127.0.0.1:5520 \
          dotnet run --project tests/MachiVerse.Alpha.ViewFaultProxy/MachiVerse.Alpha.ViewFaultProxy.csproj --configuration Release --no-build >"$proxy_log" 2>&1 &
          proxy_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5520/healthz >/dev/null; then break; fi
            if ! kill -0 "$proxy_pid" 2>/dev/null; then cat "$proxy_log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5520/healthz >/dev/null

          ASPNETCORE_URLS=http://127.0.0.1:5750 \
          dotnet run --project src/MachiVerse.View/MachiVerse.View.csproj --configuration Release --no-build --no-launch-profile >"$view_log" 2>&1 &
          view_pid=$!
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5750/ >/dev/null; then break; fi
            if ! kill -0 "$view_pid" 2>/dev/null; then cat "$view_log"; exit 1; fi
            sleep 1
          done

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then echo "No Chromium-compatible browser found."; exit 1; fi
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9426 \
            --user-data-dir="$RUNNER_TEMP/alpha-fault-chrome" \
            http://127.0.0.1:5750/ >"$RUNNER_TEMP/alpha-fault-browser.stdout" 2>"$browser_log" &
          browser_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9426/json/list >/dev/null; then break; fi
            sleep 1
          done

          set +e
          node <<'JS'
          const pages = await (await fetch('http://127.0.0.1:9426/json/list')).json();
          const page = pages.find(x => x.type === 'page' && x.url.includes('127.0.0.1:5750')) ?? pages.find(x => x.type === 'page');
          if (!page?.webSocketDebuggerUrl || typeof WebSocket === 'undefined') process.exit(2);
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('CDP open timeout')),5000);ws.onopen=()=>{clearTimeout(t);resolve();};ws.onerror=reject;});
          let id=1; const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;const t=setTimeout(()=>{pending.delete(n);reject(new Error('CDP timeout '+method));},7000);pending.set(n,{resolve:v=>{clearTimeout(t);resolve(v);},reject:e=>{clearTimeout(t);reject(e);}});ws.send(JSON.stringify({id:n,method,params}));});
          const evalJs=async expression => (await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true}))?.result?.value;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const text=()=>evalJs('document.body?.innerText ?? ""');
          const waitText=async (needle, attempts=200)=>{let value='';for(let i=0;i<attempts;i++){value=await text();if(value.includes(needle))return value;await sleep(250);}throw new Error('Missing text '+needle+'; last DOM:\n'+value);};
          const waitUntil=async (predicate, label, attempts=200)=>{for(let i=0;i<attempts;i++){if(await evalJs(predicate))return;await sleep(250);}throw new Error('Condition not reached: '+label+'; DOM:\n'+await text());};
          const valueAfter=(value,label)=>{const lines=value.split('\n').map(x=>x.trim()).filter(Boolean);const i=lines.indexOf(label);return i>=0?lines[i+1]:undefined;};
          const clickText=async label=>{const ok=await evalJs(`(()=>{const b=[...document.querySelectorAll('button')].find(x=>x.textContent.includes(${JSON.stringify(label)}));if(!b)return false;b.click();return true;})()`);if(!ok)throw new Error('Button not found: '+label);};
          const clickLinkText=async label=>{const ok=await evalJs(`(()=>{const a=[...document.querySelectorAll('a')].find(x=>x.textContent.includes(${JSON.stringify(label)}));if(!a)return false;a.click();return true;})()`);if(!ok)throw new Error('Link not found: '+label);};

          await send('Runtime.enable');
          await send('Page.enable');

          let body=await waitText('Lifecycle\nReady');
          await waitText('Confirmed basis\n0');
          await waitText('Rendered confirmed basis\n0');
          await clickLinkText('Open Diver Participation');
          body=await waitText('Diver Participation');
          if(valueAfter(body,'Last accepted publication')!=='FULL') throw new Error('Initial publication is not FULL.\n'+body);
          if(valueAfter(body,'Continuity mismatch count')!=='0' || valueAfter(body,'Automatic resync count')!=='0') throw new Error('Initial continuity diagnostics are not zero.\n'+body);
          if(valueAfter(body,'Freshness')!=='Confirmed' || valueAfter(body,'Status')!=='None') throw new Error('Initial binding projection is unexpected.\n'+body);

          await clickText('Request Alpha binding');
          body=await waitText('Continuity mismatch count\n1');
          await waitText('Publication lifecycle\nResyncing');
          await waitText('Freshness\nRefreshRequired');
          if(valueAfter(body,'Last rejected publication')!=='DELTA') body=await text();
          if(valueAfter(body,'Last rejected publication')!=='DELTA') throw new Error('Rejected publication was not DELTA.\n'+body);
          if(valueAfter(body,'Binding request UX')!=='unavailable') throw new Error('Mutation UX stayed available during mismatch.\n'+body);

          const held=await (await fetch('http://127.0.0.1:5520/healthz')).json();
          if(!held.corruptedDelta || !held.resyncObserved || held.resyncReleased) throw new Error('Fault proxy did not hold the expected force-FULL resync: '+JSON.stringify(held));

          await clickLinkText('Back to world view');
          await waitText('Lifecycle\nSyncing');
          await waitUntil(`(()=>{const t=document.body?.innerText ?? ''; return !t.includes('Rendered confirmed basis');})()`, 'renderer confirmed basis cleared');

          const release=await fetch('http://127.0.0.1:5520/control/release-resync',{method:'POST'});
          if(!release.ok) throw new Error('Could not release held resync: '+await release.text());

          await waitText('Lifecycle\nReady');
          await waitText('Confirmed basis\n3');
          await waitText('Rendered confirmed basis\n3');
          await clickLinkText('Open Diver Participation');
          body=await waitText('Diver Participation');
          if(valueAfter(body,'Last accepted publication')!=='FULL') throw new Error('Recovery publication was not FULL.\n'+body);
          if(valueAfter(body,'Continuity mismatch count')!=='1' || valueAfter(body,'Automatic resync count')!=='1') throw new Error('Recovery diagnostics are unexpected.\n'+body);
          if(valueAfter(body,'Freshness')!=='Confirmed' || valueAfter(body,'Status')!=='Active' || valueAfter(body,'Binding generation')!=='1' || valueAfter(body,'Projection basis Step')!=='3') throw new Error('Recovered binding is not authoritative ACTIVE generation 1 at basis 3.\n'+body);

          const proxy=await (await fetch('http://127.0.0.1:5520/healthz')).json();
          if(!proxy.corruptedDelta || !proxy.resyncObserved || !proxy.resyncReleased) throw new Error('Fault proxy final state is incomplete: '+JSON.stringify(proxy));
          const gateway=await (await fetch('http://127.0.0.1:5720/healthz')).json();
          if(gateway?.core?.basisStep!==3) throw new Error('Real Gateway/Core did not remain at authoritative basis 3: '+JSON.stringify(gateway));

          console.log('Bad-base DELTA fail-closed and real FULL recovery passed.');
          ws.close();
          JS
          browser_status=$?
          set -e
          if [ "$browser_status" -ne 0 ]; then
            echo "--- Core log ---"; cat "$core_log"
            echo "--- Gateway log ---"; cat "$gateway_log"
            echo "--- Fault proxy log ---"; cat "$proxy_log"
            echo "--- View log ---"; cat "$view_log"
            echo "--- Browser log ---"; cat "$browser_log"
            exit "$browser_status"
          fi
