name: issue-558 runtime target migration

on:
  push:
    branches:
      - fix/issue-558-step4-12h

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-558-step4-12h
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Complete 12h release-evidence contract migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          canonical_digest = '4cdd020abcc8ce37a54944181ce718fb4ae6de8f562bf4f846d669dbdf155a06'

          runtime = Path('tools/MachiVerse.Qa04RuntimeTarget/Program.cs')
          text = runtime.read_text(encoding='utf-8')
          for old_digest in (
              '5de8301439ca57080eefa599da284f9271b29366c791bcb9c2f85ddbfa041423',
              '4cdd020afb1e1beae8e88289dbe97f4b1862a58ffe5c5d00910230de2b555a06',
          ):
              text = text.replace(old_digest, canonical_digest)
          text = text.replace('performance.soak.24h', 'performance.soak.12h')
          text = text.replace('releaseMode ? 86_400L : 2L', 'releaseMode ? 43_200L : 2L')
          text = text.replace('profile.GetProperty("durationHours").GetInt32() != 24 ||',
                              'profile.GetProperty("durationHours").GetInt32() != 12 ||')
          required_runtime = [
              f'private const string CanonicalManifestSha256 = "{canonical_digest}";',
              'private const string SoakProfile = "performance.soak.12h";',
              'releaseMode ? 43_200L : 2L',
              'profile.GetProperty("durationHours").GetInt32() != 12 ||',
          ]
          for value in required_runtime:
              if text.count(value) != 1:
                  raise SystemExit(f'RuntimeTarget canonical value must occur exactly once: {value}')
          for forbidden in ('performance.soak.24h', '86_400L', 'durationHours").GetInt32() != 24'):
              if forbidden in text:
                  raise SystemExit(f'Residual legacy RuntimeTarget value remains: {forbidden}')
          runtime.write_text(text, encoding='utf-8')

          alpha11 = Path('tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunner.Alpha11Step3.cs')
          alpha_text = alpha11.read_text(encoding='utf-8')
          alpha_text = alpha_text.replace(
              'public string SchemaVersion { get; set; } = SchemaVersion;',
              'public string SchemaVersion { get; set; } = ReleaseEvidenceRunner.SchemaVersion;')
          if alpha_text.count('public string SchemaVersion { get; set; } = ReleaseEvidenceRunner.SchemaVersion;') != 1:
              raise SystemExit('Alpha11BenchmarkAggregateArtifact SchemaVersion initializer is not canonical')
          alpha11.write_text(alpha_text, encoding='utf-8')

          runner = Path('tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunner.cs')
          runner_text = runner.read_text(encoding='utf-8')
          helper = '    internal static bool IsCompleteSoakDuration(long durationSeconds) => durationSeconds >= MinimumSoakSeconds;\n\n'
          marker = '    internal static void ApplyFragment(string fragmentPath, string baseEvidencePath, string outputEvidencePath)\n'
          if helper not in runner_text:
              if runner_text.count(marker) != 1:
                  raise SystemExit('ApplyFragment insertion marker drifted')
              runner_text = runner_text.replace(marker, helper + marker)
          old_condition = 'if (fragment.Soak is null || fragment.Soak.DurationSeconds < MinimumSoakSeconds)'
          new_condition = 'if (fragment.Soak is null || !IsCompleteSoakDuration(fragment.Soak.DurationSeconds))'
          runner_text = runner_text.replace(old_condition, new_condition)
          if runner_text.count(new_condition) != 1 or old_condition in runner_text:
              raise SystemExit('Soak duration eligibility condition did not migrate cleanly')
          runner.write_text(runner_text, encoding='utf-8')

          verify = Path('tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunnerVerification.cs')
          verify_text = verify.read_text(encoding='utf-8')
          anchor = '        if (releaseManifest.RootElement.GetProperty("soak").GetProperty("minimumDurationSeconds").GetInt64() != 43_200)\n            throw new InvalidDataException("Release acceptance soak minimum must remain exactly 43200 seconds.");\n'
          boundary = '''        if (ReleaseEvidenceRunner.IsCompleteSoakDuration(43_199))\n            throw new InvalidDataException("Release soak duration boundary accepted 43199 seconds.");\n        if (!ReleaseEvidenceRunner.IsCompleteSoakDuration(43_200))\n            throw new InvalidDataException("Release soak duration boundary rejected 43200 seconds.");\n'''
          if boundary not in verify_text:
              if verify_text.count(anchor) != 1:
                  raise SystemExit('ReleaseEvidenceRunnerVerification boundary insertion marker drifted')
              verify_text = verify_text.replace(anchor, anchor + boundary)
          if verify_text.count('IsCompleteSoakDuration(43_199)') != 1 or verify_text.count('IsCompleteSoakDuration(43_200)') != 1:
              raise SystemExit('12h boundary verification is not canonical')
          verify.write_text(verify_text, encoding='utf-8')
          PY

      - name: Verify 12h contract and build affected tools
        shell: bash
        run: |
          dotnet build tools/MachiVerse.Qa04RuntimeTarget/MachiVerse.Qa04RuntimeTarget.csproj --configuration Release
          dotnet build tools/MachiVerse.ReleaseEvidenceRunner/MachiVerse.ReleaseEvidenceRunner.csproj --configuration Release
          dotnet run --project tools/MachiVerse.ReleaseEvidenceRunner/MachiVerse.ReleaseEvidenceRunner.csproj --configuration Release --no-build -- verify

      - name: Commit verified migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-558-runtime-target-migration.yml
          git add tools/MachiVerse.Qa04RuntimeTarget/Program.cs \
                  tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunner.Alpha11Step3.cs \
                  tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunner.cs \
                  tools/MachiVerse.ReleaseEvidenceRunner/ReleaseEvidenceRunnerVerification.cs
          git diff --cached --check
          git commit -m "fix: #558 complete 12h soak contract migration"
          git push origin HEAD:fix/issue-558-step4-12h
