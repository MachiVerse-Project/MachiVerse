name: Alpha General View browser validation

on:
  pull_request:
    branches:
      - integration/1.0-alpha
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: alpha-view-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  general-view-browser:
    name: General View browser reaches confirmed Ready
    if: github.head_ref != 'ci/int-01-view-browser-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Core Gateway and General View
        run: |
          dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
          dotnet build src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release
          dotnet build src/MachiVerse.View/MachiVerse.View.csproj --configuration Release
      - name: Launch Alpha stack and verify browser Ready state
        shell: bash
        run: |
          set -euo pipefail
          core_log="$RUNNER_TEMP/alpha-browser-core.log"
          gateway_log="$RUNNER_TEMP/alpha-browser-gateway.log"
          view_log="$RUNNER_TEMP/alpha-browser-view.log"

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_WORLD_ROOT="$RUNNER_TEMP/machiverse-alpha-browser-world" \
          Kestrel__Endpoints__Grpc__Url=http://127.0.0.1:5511 \
          Kestrel__Endpoints__Grpc__Protocols=Http2 \
          Kestrel__Endpoints__Health__Url=http://127.0.0.1:5510 \
          Kestrel__Endpoints__Health__Protocols=Http1 \
          dotnet run --project src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --no-build >"$core_log" 2>&1 &
          core_pid=$!

          cleanup() {
            kill "${view_pid:-0}" 2>/dev/null || true
            kill "${gateway_pid:-0}" 2>/dev/null || true
            kill "$core_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5510/healthz >/dev/null; then break; fi
            if ! kill -0 "$core_pid" 2>/dev/null; then cat "$core_log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5510/healthz >/dev/null || { cat "$core_log"; exit 1; }

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_CORE_ENDPOINT=http://127.0.0.1:5511 \
          ASPNETCORE_URLS=http://127.0.0.1:5520 \
          dotnet run --project src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --no-build >"$gateway_log" 2>&1 &
          gateway_pid=$!

          gateway_ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5520/healthz >"$RUNNER_TEMP/browser-gateway-health.json"; then
              if python3 - "$RUNNER_TEMP/browser-gateway-health.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          core = data.get('core') or {}
          assert data.get('status') == 'ready', data
          assert core.get('syncState') == 'Synced', data
          assert core.get('worldId'), data
          PY
              then gateway_ready=1; break; fi
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then cat "$gateway_log"; cat "$core_log"; exit 1; fi
            sleep 1
          done
          if [ "$gateway_ready" -ne 1 ]; then cat "$gateway_log"; cat "$core_log"; exit 1; fi

          ASPNETCORE_URLS=http://127.0.0.1:5550 \
          dotnet run --project src/MachiVerse.View/MachiVerse.View.csproj --configuration Release --no-build --no-launch-profile >"$view_log" 2>&1 &
          view_pid=$!

          view_ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5550/ >/dev/null; then view_ready=1; break; fi
            if ! kill -0 "$view_pid" 2>/dev/null; then cat "$view_log"; exit 1; fi
            sleep 1
          done
          if [ "$view_ready" -ne 1 ]; then cat "$view_log"; exit 1; fi

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:5550/ >"$RUNNER_TEMP/general-view-dom.html" 2>"$RUNNER_TEMP/general-view-browser.log" || {
              cat "$RUNNER_TEMP/general-view-browser.log"
              cat "$view_log"
              exit 1
            }

          cat "$RUNNER_TEMP/general-view-dom.html"
          grep -q '<dd>Ready</dd>' "$RUNNER_TEMP/general-view-dom.html"
          grep -q '<dt>Confirmed basis</dt>' "$RUNNER_TEMP/general-view-dom.html"
          grep -q '<dd>0</dd>' "$RUNNER_TEMP/general-view-dom.html"
          if grep -q '<dt>Gateway error</dt>' "$RUNNER_TEMP/general-view-dom.html"; then
            echo "General View surfaced a Gateway error."
            cat "$RUNNER_TEMP/general-view-dom.html"
            exit 1
          fi
