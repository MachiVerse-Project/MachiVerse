name: issue-558 performance harness migration

on:
  push:
    branches:
      - fix/issue-558-step4-12h

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-558-step4-12h
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Align PerformanceHarness with 12h QA-04 contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_digest = '5de8301439ca57080eefa599da284f9271b29366c791bcb9c2f85ddbfa041423'
          new_digest = '4cdd020abcc8ce37a54944181ce718fb4ae6de8f562bf4f846d669dbdf155a06'

          program = Path('tools/MachiVerse.PerformanceHarness/Program.cs')
          text = program.read_text(encoding='utf-8')
          if text.count(old_digest) != 1:
              raise SystemExit(f'Expected one old PerformanceHarness manifest digest, found {text.count(old_digest)}')
          text = text.replace(old_digest, new_digest)
          if text.count(new_digest) != 1:
              raise SystemExit('New PerformanceHarness manifest digest is not canonical')
          program.write_text(text, encoding='utf-8')

          contract = Path('tools/MachiVerse.PerformanceHarness/ManifestContract.cs')
          text = contract.read_text(encoding='utf-8')
          if text.count('performance.soak.24h') != 1:
              raise SystemExit('Expected exactly one legacy soak TestCaseId in ManifestContract')
          if text.count('RequireEqual(GetInt(manifest, "soakProfile", "durationHours"), 24, "soak duration");') != 1:
              raise SystemExit('Expected exactly one legacy soak duration in ManifestContract')
          text = text.replace('performance.soak.24h', 'performance.soak.12h')
          text = text.replace(
              'RequireEqual(GetInt(manifest, "soakProfile", "durationHours"), 24, "soak duration");',
              'RequireEqual(GetInt(manifest, "soakProfile", "durationHours"), 12, "soak duration");')
          contract.write_text(text, encoding='utf-8')

          for path in Path('tools/MachiVerse.PerformanceHarness').glob('*.cs'):
              contents = path.read_text(encoding='utf-8')
              if old_digest in contents:
                  raise SystemExit(f'Legacy QA-04 manifest digest remains in {path}')
              if 'performance.soak.24h' in contents:
                  raise SystemExit(f'Legacy 24h soak ID remains in {path}')
          PY

      - name: Build verify and materialize PerformanceHarness
        shell: bash
        run: |
          dotnet build tools/MachiVerse.PerformanceHarness/MachiVerse.PerformanceHarness.csproj --configuration Release
          dotnet run --project tools/MachiVerse.PerformanceHarness/MachiVerse.PerformanceHarness.csproj --configuration Release --no-build -- verify
          dotnet run --project tools/MachiVerse.PerformanceHarness/MachiVerse.PerformanceHarness.csproj --configuration Release --no-build -- materialize "$RUNNER_TEMP/qa04-plan"
          test -f "$RUNNER_TEMP/qa04-plan/soak-plan.json"
          grep -q '"testCaseId": "performance.soak.12h"' "$RUNNER_TEMP/qa04-plan/soak-plan.json"
          grep -q '"durationHours": 12' "$RUNNER_TEMP/qa04-plan/soak-plan.json"

      - name: Commit verified migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-558-performance-harness-migration.yml
          git add tools/MachiVerse.PerformanceHarness/Program.cs tools/MachiVerse.PerformanceHarness/ManifestContract.cs
          git diff --cached --check
          git commit -m "fix: #558 align performance harness with 12h soak"
          git push origin HEAD:fix/issue-558-step4-12h
