name: Alpha View link validation

on:
  pull_request:
    branches:
      - integration/1.0-alpha
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: alpha-view-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core-gateway-view-link:
    name: Core to Gateway to View wire link
    if: github.head_ref != 'ci/int-01-core-gateway-view-link-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build Core Gateway and independent View probe
        run: |
          dotnet build src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release
          dotnet build src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release
          dotnet build tools/MachiVerse.Int01ViewProbe/MachiVerse.Int01ViewProbe.csproj --configuration Release
      - name: Launch processes and verify View protocol publication
        shell: bash
        run: |
          set -euo pipefail
          core_log="$RUNNER_TEMP/alpha-view-core.log"
          gateway_log="$RUNNER_TEMP/alpha-view-gateway.log"

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_WORLD_ROOT="$RUNNER_TEMP/machiverse-alpha-view-world" \
          Kestrel__Endpoints__Grpc__Url=http://127.0.0.1:5531 \
          Kestrel__Endpoints__Grpc__Protocols=Http2 \
          Kestrel__Endpoints__Health__Url=http://127.0.0.1:5530 \
          Kestrel__Endpoints__Health__Protocols=Http1 \
          dotnet run --project src/MachiVerse.Simulation.Core/MachiVerse.Simulation.Core.csproj --configuration Release --no-build >"$core_log" 2>&1 &
          core_pid=$!

          cleanup() {
            kill "${gateway_pid:-0}" 2>/dev/null || true
            kill "$core_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          core_ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5530/healthz >/dev/null; then
              core_ready=1
              break
            fi
            if ! kill -0 "$core_pid" 2>/dev/null; then
              cat "$core_log"
              exit 1
            fi
            sleep 1
          done
          if [ "$core_ready" -ne 1 ]; then
            cat "$core_log"
            exit 1
          fi

          MACHIVERSE_ALPHA_LOCAL=1 \
          MACHIVERSE_CORE_ENDPOINT=http://127.0.0.1:5531 \
          ASPNETCORE_URLS=http://127.0.0.1:5540 \
          dotnet run --project src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --no-build >"$gateway_log" 2>&1 &
          gateway_pid=$!

          gateway_ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5540/healthz >"$RUNNER_TEMP/alpha-view-gateway-health.json"; then
              if python3 - "$RUNNER_TEMP/alpha-view-gateway-health.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          core = data.get('core') or {}
          assert data.get('status') == 'ready', data
          assert core.get('negotiated') is True, data
          assert core.get('syncState') == 'Synced', data
          assert core.get('localMaster') is True, data
          assert core.get('worldId'), data
          PY
              then
                gateway_ready=1
                break
              fi
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              cat "$gateway_log"
              cat "$core_log"
              exit 1
            fi
            sleep 1
          done
          if [ "$gateway_ready" -ne 1 ]; then
            cat "$gateway_log"
            cat "$core_log"
            exit 1
          fi

          dotnet run --project tools/MachiVerse.Int01ViewProbe/MachiVerse.Int01ViewProbe.csproj \
            --configuration Release --no-build -- \
            http://127.0.0.1:5540 ws://127.0.0.1:5540/ws/v1/view
